<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robot Simulation Sandbox</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Robot Simulation Sandbox</h1>
      <div class="workspace">
        <section class="panel editor-panel">
          <h2>Code Editor</h2>
          <p class="hint">
            FTC-style motor control. Power between -1 and 1; negative = backwards.
            <code>leftMotor.setPower(power)</code>,
            <code>rightMotor.setPower(power)</code>,
            <code>sleep(milliseconds)</code>,
            <code>intake()</code>,
            <code>shoot(220)</code>.
          </p>
          <textarea id="codeEditor" aria-label="Code editor">leftMotor.setPower(0.5);
rightMotor.setPower(0.5);
sleep(1000);
leftMotor.setPower(0);
rightMotor.setPower(0);
intake();
shoot(220);</textarea>
          <div class="button-row">
            <button id="runButton" type="button">Run</button>
            <button id="resetButton" type="button">Reset</button>
          </div>
          <p id="statusMessage" class="status" aria-live="polite"></p>
        </section>

        <section class="panel simulation-panel">
          <h2>Simulation</h2>
          <div class="hud" aria-label="Robot status heads-up display">
            <div class="hud-item">
              <span class="hud-label">Score</span>
              <span id="scoreValue" class="hud-value">0</span>
            </div>
            <div class="hud-item">
              <span class="hud-label">Held balls</span>
              <span id="heldValue" class="hud-value">0</span>
            </div>
          </div>
          <canvas
            id="simulationCanvas"
            width="500"
            height="400"
            aria-label="Robot simulation canvas"
          ></canvas>
        </section>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
